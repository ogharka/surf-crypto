<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surf Intelligence — Crypto Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-dot"></div>
        <span class="brand-name">Surf Intelligence</span>
      </div>
      <span class="brand-badge">Premium</span>
      <nav class="sidebar-nav">
        <a class="nav-item active" href="#"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
        <a class="nav-item" href="#" onclick="showSection('watchlist')"><i class="ti ti-star"></i> Watchlist</a>
        <a class="nav-item" href="#" onclick="showSection('news')"><i class="ti ti-news"></i> News feed</a>
      </nav>
      <div class="sidebar-footer">
        <div class="api-status" id="api-status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Connecting…</span>
        </div>
      </div>
    </aside>

    <main class="main">

      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title">Crypto prices</h1>
          <span class="updated" id="last-updated">Fetching…</span>
        </div>
        <div class="topbar-right">
          <div class="search-wrap">
            <i class="ti ti-search search-icon"></i>
            <input type="text" id="search-input" placeholder="Add token — BTC, AVAX…" />
          </div>
          <button class="btn-primary" onclick="addToken()"><i class="ti ti-plus"></i> Add</button>
          <button class="btn-ghost" onclick="refreshAll()"><i class="ti ti-refresh"></i></button>
        </div>
      </header>

      <section class="summary-row" id="summary-row">
        <div class="summary-card">
          <div class="summary-label">Tokens tracked</div>
          <div class="summary-val" id="sum-count">—</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Gainers (24h)</div>
          <div class="summary-val green" id="sum-gainers">—</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Losers (24h)</div>
          <div class="summary-val red" id="sum-losers">—</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Avg change (24h)</div>
          <div class="summary-val" id="sum-avg">—</div>
        </div>
      </section>

      <section>
        <p class="section-label">Watchlist</p>
        <div class="token-grid" id="token-grid">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </section>

      <section id="detail-area"></section>
      <section id="news-area"></section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
